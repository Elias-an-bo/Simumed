# Publicação na Netlify (plano gratuito). Variáveis de ambiente: veja docs/PUBLICACAO.md
[build]
  command = "npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts --only-missing && npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
